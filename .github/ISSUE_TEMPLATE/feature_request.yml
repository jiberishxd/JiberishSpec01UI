name: Feature request
description: An idea for something new or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do in game?
      description: Describe the goal rather than the implementation. Mock-ups or screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would make easier, or what's hard today.
